[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-pqc-migrator"
version = "0.1.0"
description = "Post-Quantum Cryptography Migration Engine for AWS and GCP"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.8",
    "rich>=13.9.4",
    "pydantic>=2.11.0",
    "anthropic>=0.57.0",
    "boto3>=1.38.0",
    "google-auth>=2.40.0",
    "python-dateutil>=2.9.0",
]

[project.scripts]
cloud-pqc-migrator = "cloud_pqc_migrator.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-python-dateutil>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cloud_pqc_migrator*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "google.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
